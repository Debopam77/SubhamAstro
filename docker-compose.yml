services:
  # Development service with Hot Module Replacement (HMR)
  subham-astro:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: subham-astro-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Mount host directory into container for live reload
      - .:/app
      # Prevent host directory from overriding container node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  # Optional production service: serves optimized build via Nginx
  subham-astro-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: subham-astro-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    profiles:
      - production
